<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Set passcode — Learning Center</title><link rel="stylesheet" href="css/portal.css"></head>
<body><main><header><h1>Learning Center</h1><p>Set your new secret words</p></header><section class="panel login"><p id="status" role="status">Open this page using your password recovery email.</p><form id="reset" hidden><label for="password">New passcode</label><input id="password" type="password" autocomplete="new-password" required minlength="6" maxlength="72"><label for="confirm">Repeat passcode</label><input id="confirm" type="password" autocomplete="new-password" required minlength="6" maxlength="72"><button type="submit">Save passcode</button></form><p><a href="./index.html">Return to Learning Center</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/settings.js"></script><script>
'use strict';
const c=window.PORTAL_SETTINGS, db=window.supabase.createClient(c.url,c.key,{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}}), form=document.getElementById('reset'), status=document.getElementById('status');
let recovering=false;
db.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'&&session){recovering=true;form.hidden=false;status.textContent='Choose and confirm your new passcode.';}
});
form.addEventListener('submit',async e=>{
 e.preventDefault();if(!recovering)return;
 const p=document.getElementById('password'),q=document.getElementById('confirm'),button=form.querySelector('button');
 if(p.value!==q.value){status.textContent='The passcodes do not match.';return}
 button.disabled=true;
 try{
 const {error}=await db.auth.updateUser({password:p.value});
 if(error){status.textContent='Unable to save: '+error.message;return}
 p.value='';q.value='';recovering=false;form.hidden=true;status.textContent='Passcode saved. Return to the Learning Center and sign in.';
 await db.auth.signOut({scope:'local'});
 }catch{status.textContent='Unable to save the passcode. Try again.'}finally{button.disabled=false}
});
</script></body></html>
